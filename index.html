<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wander — A Photo Roll</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-head">
  <div class="head-inner">
    <h1 class="wordmark">Wander</h1>
    <p class="tagline">Twelve frames, four places, one roll of film.</p>
  </div>
  <div class="sprocket-row" aria-hidden="true"></div>
</header>

<nav class="filter-bar" aria-label="Filter by category">
  <button class="filter-chip is-active" data-filter="all">All frames</button>
  <button class="filter-chip" data-filter="mountains">Mountains</button>
  <button class="filter-chip" data-filter="ocean">Ocean</button>
  <button class="filter-chip" data-filter="forest">Forest</button>
  <button class="filter-chip" data-filter="desert">Desert</button>
</nav>

<main class="gallery" id="gallery">
  <!-- frames injected by script.js -->
</main>

<footer class="site-foot">
  <p>Shot on location, developed in the browser. Click any frame to view it full-size.</p>
</footer>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Image viewer" hidden>
  <button class="lb-close" id="lbClose" aria-label="Close viewer">&times;</button>
  <button class="lb-nav lb-prev" id="lbPrev" aria-label="Previous image">&#8249;</button>
  <div class="lb-frame">
    <img src="" alt="" id="lbImage" class="lb-image">
    <div class="lb-caption">
      <span class="lb-index" id="lbIndex"></span>
      <span class="lb-title" id="lbTitle"></span>
      <span class="lb-category" id="lbCategory"></span>
    </div>
  </div>
  <button class="lb-nav lb-next" id="lbNext" aria-label="Next image">&#8250;</button>
</div>

<script src="script.js"></script>
</body>
</html>
